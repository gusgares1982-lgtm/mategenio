<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b3d"><title>MateGenio · El faro de las luciérnagas</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#fff8e8;background:#101b3d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 45%,#304b74 0%,#17274d 55%,#0c1735 100%);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffe38b;outline-offset:4px}.app{max-width:1080px;margin:auto;padding:18px 20px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.02em;font-size:21px}.brand span{color:#ffe28a}.pill{border:1px solid #ffffff4a;background:#ffffff16;color:white;padding:10px 16px;border-radius:99px}.story{text-align:center;max-width:720px;margin:18px auto 8px}.eyebrow{color:#f7d78a;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase}h1{font-size:clamp(32px,6vw,62px);letter-spacing:-.05em;line-height:1.08;margin:12px 0}p{line-height:1.55}.story p{color:#d9e6f3;font-size:clamp(16px,2.5vw,20px)}.scene{height:min(50vh,430px);min-height:280px;position:relative;overflow:hidden;border-radius:34px;background:linear-gradient(#1d3565,#345776 65%,#253b53);box-shadow:0 24px 70px #0005;border:2px solid #ffffff26}.moon{position:absolute;right:13%;top:10%;width:78px;height:78px;border-radius:50%;background:#fff1b2;box-shadow:0 0 55px 20px #ffe4a34d}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff8d5 1.5px,transparent 2px);background-size:71px 69px;opacity:.5}.hill{position:absolute;bottom:-80px;width:130%;height:170px;border-radius:50% 50% 0 0;background:#152f39;left:-15%}.hill.two{bottom:-120px;left:20%;background:#102832}.river{position:absolute;bottom:0;width:100%;height:32%;background:repeating-linear-gradient(175deg,#6bb2c53b 0 7px,#3a8ea94a 8px 17px);border-top:4px solid #8de5db70}.bridge{position:absolute;left:8%;right:8%;bottom:17%;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:5px;height:58px}.log{height:48px;flex:1;max-width:95px;background:linear-gradient(90deg,#a96c3d,#dca269,#a96c3d);border:3px solid #6e452d;border-radius:15px;box-shadow:0 7px #6d4328;animation:appear .3s ease-out}.log:after{content:'✦';display:block;text-align:center;color:#fbe0a2;padding-top:8px}.hero{position:absolute;left:9%;bottom:30%;width:105px;height:105px;filter:drop-shadow(0 10px 6px #0005);transition:transform .5s;z-index:2}.hero svg{width:100%;height:100%}.hero.jump{transform:translateX(180px) translateY(-45px)}.fireflies{position:absolute;inset:0;pointer-events:none}.fly:focus-visible{outline:3px solid white;outline-offset:2px}.fly{position:absolute;width:60px;height:60px;border:19px solid transparent;background-clip:padding-box;touch-action:manipulation;border-radius:50%;background:#ffea86;box-shadow:0 0 22px 9px #ffdc5e77;animation:float 2.5s ease-in-out infinite alternate}.lighthouse{position:absolute;bottom:22%;left:44%;width:88px;height:190px;background:linear-gradient(90deg,#d5d9db,#fff7d8,#a9c5d2);clip-path:polygon(25% 15%,75% 15%,90% 100%,10% 100%);filter:drop-shadow(0 12px 10px #0008)}.lamp{position:absolute;bottom:calc(22% + 155px);left:calc(44% + 21px);width:46px;height:46px;border-radius:50%;background:#8c9aa8;border:4px solid #d9ecf3;transition:all .5s}.lamp.lit{background:#fff1a0;box-shadow:0 0 80px 48px #ffe174a0}.panel{background:#ffffffef;color:#182b48;border-radius:26px;padding:18px 22px;margin:-22px auto 0;position:relative;max-width:800px;box-shadow:0 15px 40px #0004}.panel h2{font-size:20px;margin:0 0 7px}.panel p{margin:0 0 14px;color:#526177}.controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}.choice{border:2px solid #c9d7e5;background:white;border-radius:18px;padding:13px 20px;font-size:22px;font-weight:850;min-width:70px;color:#193958}.choice.selected{border-color:#4d77b0;background:#e4f3ff}.primary{background:#ffcc67;color:#3a2a16;border:0;border-radius:18px;padding:15px 23px;font-weight:900;box-shadow:0 5px #cc9745}.primary:disabled{opacity:.45;box-shadow:none}.status{min-height:27px;text-align:center;font-weight:700;margin:12px 0 0!important;color:#255e67!important}.progress{display:flex;justify-content:center;gap:10px;margin:14px}.dot{height:8px;width:48px;background:#ffffff40;border-radius:20px}.dot.done{background:#ffda77}.counter{font-size:26px;font-weight:900;min-width:45px;text-align:center}.flybtn{width:57px;height:57px;border:2px solid #b8d1d7;border-radius:50%;background:#fff8d0;font-size:26px}.flybtn.on{background:#ffda65;box-shadow:0 0 0 5px #ffda6560}.note{text-align:center;font-size:12px;color:#aebfd4;margin-top:20px}@keyframes float{to{transform:translate(12px,-18px)}}@keyframes appear{from{transform:scale(.3);opacity:0}}@media(max-width:600px){.app{padding:12px}.scene{min-height:320px;height:45vh;border-radius:22px}.panel{padding:18px 12px}.hero{width:75px;height:75px}.moon{width:55px;height:55px}.choice{min-width:57px;padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.gem-field{position:absolute;left:5%;right:5%;bottom:17%;display:flex;justify-content:space-evenly;gap:10px;z-index:4}.gem{font-size:23px;color:#fff;border:2px solid #b9f6ff;border-radius:24px;background:linear-gradient(145deg,#47d1f2,#6649d5);min-width:76px;min-height:76px;box-shadow:0 8px 0 #243a79,0 0 25px #73edff88;touch-action:manipulation;cursor:pointer}.gem:nth-child(2){background:linear-gradient(145deg,#ff9ee8,#a23da8)}.gem:nth-child(3){background:linear-gradient(145deg,#ffe48d,#ed8538)}.energy-meter{position:absolute;left:20%;right:20%;bottom:5%;border-radius:24px;padding:9px 6px;text-align:center;background:#102e58d9;border:2px solid #a5d9ec;color:#fff;font-weight:900;z-index:5}.energy-meter.ready{background:#207f65}.energy-meter.over{background:#a53c54}@media(max-width:600px){.gem{min-width:62px;min-height:62px}}.fly-clues{position:absolute;inset:auto 10px 8px;display:flex;justify-content:space-between;gap:10px;z-index:6;pointer-events:none}.fly-clue{padding:8px 12px;border-radius:14px;background:#0c2341db;border:1px solid #d7e9ff55;color:#fff5cf;font-size:clamp(13px,2vw,19px);font-weight:800;letter-spacing:.05em;box-shadow:0 3px 15px #0005}@media(max-width:440px){.fly-clues{gap:5px}.fly-clue{padding:6px;font-size:12px}}</style></head><body><main class="app"><header class="top"><div class="brand">mate<span>genio</span> ✦</div><button class="pill" id="restart">↻ Reiniciar</button></header><div class="progress" aria-label="Progreso de tres escenas"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><section class="story"><div class="eyebrow" id="chapter">Aventura 01 · El bosque nocturno</div><h1 id="title">El faro de las luciérnagas</h1><p id="story">El bosque se ha quedado sin luz. Niko necesita tu ingenio para encender el faro. ¿Le ayudas?</p></section><div class="scene" id="scene" aria-label="Escenario del bosque"><div class="stars"></div><div class="moon"></div><div class="hill"></div><div class="hill two"></div><div id="objects"></div></div><section class="panel"><h2 id="question">¿Preparado para la aventura?</h2><p id="instruction">Cada decisión transforma el bosque.</p><div class="controls" id="controls"></div><p class="status" id="status" role="status" aria-live="polite"></p></section><p class="note">Prototipo jugable · Sin cuentas, anuncios ni datos enviados</p></main>
<script>
const $=id=>document.getElementById(id);let level=0,variant=0,selected=0,solved=false;const random=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
function button(label,fn,cls='choice'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b}
function text(id,value){$(id).textContent=value}function status(s){text('status',s)}
function stage(){solved=false;selected=0;status('');document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('done',i<level));const scene=$('objects'),controls=$('controls');scene.replaceChildren();controls.replaceChildren();if(level===0){const target=random(5,9),first=random(1,target-2),missing=target-first;variant={target,first,missing};text('chapter','01 / 03 · El puente');text('title','Un puente para Niko');text('story','El río corta el camino. Construye un puente con troncos para ayudar a Niko a cruzar.');text('question',`El puente necesita ${target} troncos. Ya tenemos ${first}. ¿Cuántos faltan?`);text('instruction','Toca el puente para colocar troncos. También puedes usar los botones + y −.');const river=document.createElement('div');river.className='river';scene.append(river);const bridge=document.createElement('div');bridge.className='bridge';bridge.id='bridge';bridge.setAttribute('role','button');bridge.setAttribute('tabindex','0');bridge.setAttribute('aria-label','Toca el puente para añadir un tronco');bridge.addEventListener('click',()=>adjust(1));bridge.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();adjust(1)}});scene.append(bridge);const hero=document.createElement('div');hero.className='hero';hero.id='hero';hero.innerHTML="<svg viewBox=\"0 0 160 150\" aria-label=\"Niko, el zorro\" role=\"img\"><defs><linearGradient id=\"fur\" x2=\"0\" y2=\"1\"><stop stop-color=\"#ffbd60\"/><stop offset=\"1\" stop-color=\"#dd6538\"/></linearGradient></defs><path d=\"M25 52 14 7 65 31 90 31 142 7 131 56Q158 83 133 117Q110 145 79 143Q39 143 20 111Q5 82 25 52Z\" fill=\"url(#fur)\" stroke=\"#7d3d35\" stroke-width=\"4\"/><path d=\"M27 67Q53 93 79 78Q110 93 131 67Q137 117 81 139Q25 118 27 67Z\" fill=\"#fff3d8\"/><path d=\"M25 24 34 53 55 40Z M106 40 127 53 134 24Z\" fill=\"#ffdfb6\"/><ellipse cx=\"56\" cy=\"80\" rx=\"7\" ry=\"10\" fill=\"#302b43\"/><ellipse cx=\"105\" cy=\"80\" rx=\"7\" ry=\"10\" fill=\"#302b43\"/><circle cx=\"53\" cy=\"77\" r=\"2.5\" fill=\"white\"/><circle cx=\"102\" cy=\"77\" r=\"2.5\" fill=\"white\"/><path d=\"M70 104Q80 113 90 104L80 100Z\" fill=\"#3a2934\"/><path d=\"M80 111v7m0 0q-10 8-17-1m17 1q10 8 17-1\" stroke=\"#80545a\" fill=\"none\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"40\" cy=\"106\" r=\"7\" fill=\"#ff9c87\" opacity=\".7\"/><circle cx=\"119\" cy=\"106\" r=\"7\" fill=\"#ff9c87\" opacity=\".7\"/></svg>";scene.append(hero);for(let i=0;i<first;i++)bridge.append(log());const counter=document.createElement('span');counter.className='counter';counter.id='count';counter.textContent='0';controls.append(button('−',()=>adjust(-1)),counter,button('+',()=>adjust(1)),button('Probar el puente',check,'primary'))}
else if(level===1){const a=random(2,4),b=random(2,4);variant={a,b,target:a+b};text('chapter','02 / 03 · El jardín de luz');text('title','Despierta las luciérnagas');text('story','Las pequeñas luces están dormidas. Necesitamos despertar las justas para abrir el sendero.');text('question',`Mira las dos pistas del bosque: ${a} junto al árbol y ${b} junto al arroyo. ¿Cuántas luces necesitas en total?`);text('instruction','Toca las luces del bosque para encenderlas o apagarlas. Mira el contador y consigue la cantidad exacta.');const flies=document.createElement('div');flies.className='fireflies';scene.append(flies);for(let i=0;i<10;i++){const f=document.createElement('span');f.className='fly';f.style.left=(12+(i%5)*17)+'%';f.style.top=(i<5?22:64)+'%';f.style.opacity='.18';f.style.animationDelay=(i*.13)+'s';f.id='fly'+i;flies.append(f)}const clues=document.createElement('div');clues.className='fly-clues';clues.setAttribute('aria-label',a+' luciérnagas en el árbol y '+b+' junto al arroyo');const clueA=document.createElement('div');clueA.className='fly-clue';clueA.textContent='🌳 Árbol: '+Array(a).fill('✦').join(' ');const clueB=document.createElement('div');clueB.className='fly-clue';clueB.textContent='💧 Arroyo: '+Array(b).fill('✦').join(' ');clues.append(clueA,clueB);scene.append(clues);const flyCount=document.createElement('span');flyCount.className='counter';flyCount.id='fly-count';flyCount.setAttribute('role','status');flyCount.setAttribute('aria-live','polite');flyCount.textContent='0 / '+variant.target+' luces';controls.append(flyCount);for(let i=0;i<10;i++){const f=$('fly'+i);f.style.pointerEvents='auto';f.style.cursor='pointer';f.setAttribute('role','button');f.setAttribute('tabindex','0');f.setAttribute('aria-label','Luciérnaga '+(i+1));f.setAttribute('aria-pressed','false');f.addEventListener('click',()=>toggleFly(i));f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFly(i)}})}controls.append(button('Iluminar sendero',check,'primary'))}
else if(level===2){const target=random(9,14);variant={target};text('chapter','03 / 03 · El faro');text('title','Enciende el faro');text('story','El faro necesita una combinación de energía. ¡Puedes encontrar más de una solución!');text('question',`Reparte exactamente ${target} unidades de luz entre los tres cristales.`);text('instruction','Prueba diferentes combinaciones: hay más de una solución correcta.');const tower=document.createElement('div');tower.className='lighthouse';scene.append(tower);const lamp=document.createElement('div');lamp.className='lamp';lamp.id='lamp';scene.append(lamp);variant.values=[0,0,0];const gems=document.createElement('div');gems.className='gem-field';gems.setAttribute('aria-label','Tres cristales mágicos interactivos');scene.append(gems);for(let i=0;i<3;i++){const gem=button('◆',()=>crystal(i,1),'gem');gem.id='gem'+i;gem.setAttribute('aria-label','Cristal '+(i+1)+': cero unidades. Toca para añadir una');gems.append(gem)}const meter=document.createElement('div');meter.className='energy-meter';meter.id='energy-meter';meter.setAttribute('role','progressbar');meter.setAttribute('aria-valuemin','0');meter.setAttribute('aria-valuemax',String(target));meter.setAttribute('aria-valuenow','0');meter.textContent='0 / '+target+' unidades';scene.append(meter);for(let i=0;i<3;i++){const group=document.createElement('div');group.style.display='flex';group.style.alignItems='center';group.style.gap='5px';group.setAttribute('aria-label','Cristal '+(i+1));const count=document.createElement('span');count.className='counter';count.id='crystal'+i;count.textContent='0';group.append(button('−',()=>crystal(i,-1)),count,button('+',()=>crystal(i,1)));controls.append(group)}controls.append(button('Encender el faro',check,'primary'))}else{finish()}}
function log(){const el=document.createElement('div');el.className='log';return el}
function adjust(delta){if(solved)return;selected=Math.max(0,Math.min(9-variant.first,selected+delta));text('count',selected);const bridge=$('bridge');bridge.setAttribute('aria-label',`Puente con ${variant.first+selected} troncos. Toca para añadir otro`);bridge.replaceChildren();for(let i=0;i<variant.first+selected;i++)bridge.append(log());status('')}
function toggleFly(i){if(solved)return;const f=$('fly'+i);const on=f.getAttribute('aria-pressed')!=='true';f.setAttribute('aria-pressed',String(on));f.style.opacity=on?'1':'.18';const n=document.querySelectorAll('.fly[aria-pressed="true"]').length;text('fly-count',n+' / '+variant.target+' luces');status(n===variant.target?'¡Las luces están listas! Abre el sendero.':n>variant.target?'Hay '+(n-variant.target)+' luces de más. Apaga alguna.':'')}
function crystal(i,d){if(solved)return;variant.values[i]=Math.max(0,Math.min(9,variant.values[i]+d));text('crystal'+i,variant.values[i]);const gem=$('gem'+i);if(gem){gem.textContent='◆ '+variant.values[i];gem.setAttribute('aria-label','Cristal '+(i+1)+': '+variant.values[i]+' unidades. Toca para añadir una');gem.style.filter='brightness('+(1+variant.values[i]*.07)+')'}const sum=variant.values.reduce((a,b)=>a+b,0),meter=$('energy-meter');if(meter){meter.textContent=sum+' / '+variant.target+' unidades';meter.setAttribute('aria-valuenow',String(Math.min(sum,variant.target)));meter.classList.toggle('over',sum>variant.target);meter.classList.toggle('ready',sum===variant.target)}status(sum>variant.target?'Hay demasiada energía. Quita alguna unidad.':sum===variant.target?'¡Energía completa! Ya puedes encender el faro.':'')}
function check(){if(solved)return;const answer=level===0?selected:level===1?document.querySelectorAll('.fly[aria-pressed="true"]').length:variant.values.reduce((a,b)=>a+b,0);const correct=level===0?variant.missing:variant.target;if(answer!==correct){status(answer<correct?'Faltan '+(correct-answer)+'. Observa y vuelve a probar.':'Sobran '+(answer-correct)+'. Puedes quitar y probar otra vez.');return}solved=true;if(level===0)$('hero').classList.add('jump');if(level===2)$('lamp').classList.add('lit');status(level===2?'¡El bosque vuelve a brillar!':'¡Lo has conseguido! El bosque cambia gracias a ti.');const next=button(level===2?'Celebrar ✨':'Seguir la aventura →',()=>{level++;stage()},'primary');$('controls').replaceChildren(next)}
function finish(){text('chapter','Aventura completada');text('title','¡Has devuelto la luz!');text('story','Niko y las luciérnagas celebran tu ingenio. Cada aventura puede resolverse de una manera diferente.');text('question','El faro brilla gracias a ti');text('instruction','¿Quieres probar otra combinación?');$('controls').replaceChildren(button('Volver a jugar ↻',()=>{level=0;stage()},'primary'));status('¡Gran trabajo!');const lamp=$('lamp');if(lamp)lamp.classList.add('lit');document.querySelectorAll('.dot').forEach(d=>d.classList.add('done'))}
$('restart').addEventListener('click',()=>{level=0;stage()});stage();
</script></body></html>
