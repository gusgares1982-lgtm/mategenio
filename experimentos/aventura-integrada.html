:root{font-family:system-ui,sans-serif;color:#fff3cf;background:#0b1930}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 10%,#294b65,#0b1930)}main{max-width:1050px;margin:auto;padding:clamp(8px,2vw,20px)}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(19px,3vw,32px);margin:8px 0}#progress{font-size:clamp(14px,2vw,19px)}#instruction{font-size:clamp(17px,2.3vw,23px);min-height:2em;margin:8px 0}svg{display:block;width:100%;height:auto;aspect-ratio:900/530;max-height:65dvh;min-height:0;border-radius:22px;touch-action:none;background:#172c43;box-shadow:0 15px 35px #0006}button{background:#ffdb8c;color:#34261c;border:0;border-radius:15px;min-height:48px;padding:10px 20px;font:700 17px system-ui;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:4px solid white;outline-offset:3px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}#message{font-weight:700;font-size:clamp(16px,2vw,21px);min-height:2em}#next{background:#a5e4bc}#next[hidden]{display:none}.piece{cursor:grab}.piece:active{cursor:grabbing}.target{cursor:pointer}@media(max-width:600px){svg{max-height:57dvh}button{flex:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><main><header><h1>✦ El faro de las luciérnagas</h1><strong id="progress">Cristales 0 / 3</strong></header><p id="instruction"></p><svg id="world" viewBox="0 0 900 530" role="group" aria-label="Aventura matemática interactiva"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10213f"/><stop offset="1" stop-color="#46746a"/></linearGradient><radialGradient id="shine"><stop stop-color="#ffe9a1"/><stop offset="1" stop-color="#ffe9a1" stop-opacity="0"/></radialGradient></defs><rect width="900" height="530" fill="url(#sky)"/><circle cx="765" cy="80" r="42" fill="#ffe5a7"/><path d="M0 350Q180 270 360 340T900 330V530H0Z" fill="#1b4a4c"/><path d="M0 420Q250 335 470 400T900 380V530H0Z" fill="#266354"/><g id="objects"></g></svg><div class="controls"><button id="reset">Reintentar</button><button id="hint">Pista</button><button id="check">Comprobar</button><button id="next" hidden>Continuar →</button></div><p id="message" role="status" aria-live="polite"></p></main>
<script>(()=>{'use strict';const ns='http://www.w3.org/2000/svg',world=document.querySelector('#world'),objects=document.querySelector('#objects'),instruction=document.querySelector('#instruction'),message=document.querySelector('#message'),progress=document.querySelector('#progress'),next=document.querySelector('#next');let stage=0,crystals=0,won=false,level=0,round=0,goal=0,slots=[],selected=null,lights=new Set(),pattern=[],beam=[0,0,0],drag=null,suppressClick=false;const el=(tag,attrs,parent=objects)=>{const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n};const txt=(x,y,s,size=25,color='#fff4cb')=>el('text',{x,y,'text-anchor':'middle',fill:color,'font-size':size,'font-weight':800},objects).textContent=s;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function background(){objects.replaceChildren();for(let i=0;i<24;i++)el('circle',{cx:(i*137+35)%900,cy:(i*83+31)%260,r:1+i%3,fill:'#ffebba',opacity:.4+i%3*.2})}function target(node,action,label){node.setAttribute('role','button');node.setAttribute('tabindex','0');node.setAttribute('aria-label',label);const activate=()=>{const index=[...objects.querySelectorAll('[role=button]')].indexOf(node);const keyboard=document.activeElement===node;action();if(keyboard){const controls=objects.querySelectorAll('[role=button]');(controls[Math.min(index,controls.length-1)]||document.querySelector('#check')).focus()}};node.addEventListener('click',activate);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})}function niko(){const g=el('g',{transform:'translate(38 108)','aria-hidden':'true'});const shape=(tag,a)=>el(tag,a,g);shape('ellipse',{cx:58,cy:92,rx:47,ry:13,fill:'#061d31',opacity:.55});shape('path',{d:'M29 49Q5 6 26 0L50 28Q67 9 90 3L88 57Z',fill:'#ba8368',stroke:'#ffe5b4','stroke-width':3});shape('ellipse',{cx:56,cy:57,rx:43,ry:42,fill:'#dcaa80',stroke:'#ffe5b4','stroke-width':3});shape('ellipse',{cx:42,cy:55,rx:5,ry:7,fill:'#233449'});shape('ellipse',{cx:73,cy:55,rx:5,ry:7,fill:'#233449'});shape('path',{d:won?'M44 72Q56 87 70 72':'M46 73Q57 80 68 73',stroke:'#633f41','stroke-width':4,fill:'none','stroke-linecap':'round'});shape('circle',{cx:92,cy:91,r:16,fill:'#f4c968',stroke:'#fff3c5','stroke-width':3});shape('circle',{cx:92,cy:91,r:28,fill:'url(#shine)',opacity:.85});shape('path',{d:'M77 92L62 83',stroke:'#dcaa80','stroke-width':9,'stroke-linecap':'round'});const bubble=shape('g',{transform:'translate(106 -6)'});el('rect',{x:0,y:0,width:185,height:55,rx:18,fill:'#102e43',stroke:'#f9e2a7','stroke-width':2},bubble);el('path',{d:'M8 40L-10 54L16 49Z',fill:'#102e43'},bubble);const words=stage===3?'¡Lo logramos!':won?'¡Qué gran idea!':stage===0?'¡Construye el paso!':stage===1?'¡Mira los colores!':'¡Enciende el faro!';el('text',{x:92,y:33,'text-anchor':'middle',fill:'#fff4d3','font-size':18,'font-weight':750},bubble).textContent=words;}
function meter(value,max,label){const x=315,y=108,w=385;el('rect',{x,y,width:w,height:22,rx:11,fill:'#0c293c',stroke:'#ffe9af','stroke-width':2});el('rect',{x:x+3,y:y+3,width:Math.max(0,(w-6)*Math.min(value,max)/max),height:16,rx:8,fill:value>max?'#e48a8a':'#8be3bd'});txt(510,151,label,19)}function render(){background();niko();progress.textContent='Cristales '+crystals+' / 3';next.hidden=!won&&stage!==3;next.textContent=stage===3?'Jugar otra vez ↻':'Continuar →';document.querySelector('#check').disabled=won||stage===3;if(stage===3){instruction.textContent='¡Has encendido el faro! Los tres cristales iluminan el bosque. Puedes iniciar una nueva aventura.';document.querySelector('#check').disabled=true;next.hidden=false;next.textContent='Jugar otra vez ↻';el('path',{d:'M350 480L388 135H512L550 480Z',fill:'#d7d5c4',stroke:'#f7e8b5','stroke-width':8});for(let i=0;i<5;i++)el('rect',{x:392+i*24,y:230,width:14,height:18,rx:4,fill:'#536d83'});el('path',{d:'M365 165L450 80L535 165Z',fill:'#a55e62',stroke:'#f6dfb1','stroke-width':6});el('rect',{x:390,y:135,width:120,height:70,rx:12,fill:'#f9df88',stroke:'#fff6c7','stroke-width':6});el('path',{d:'M450 175L50 15L850 15Z',fill:'#ffe6a0',opacity:.25});el('circle',{cx:450,cy:175,r:130,fill:'url(#shine)'});for(let i=0;i<3;i++)el('path',{d:`M${340+i*110} 480l25 -45 25 45Z`,fill:['#7dc2eb','#eec878','#d994cc'][i],stroke:'#fff1c2','stroke-width':4});txt(450,70,'¡EL BOSQUE VUELVE A BRILLAR!',30);message.textContent='¡Aventura completada! Tres desafíos, tres cristales.';}else if(stage===0){instruction.textContent='Construye el puente: toca troncos de 1, 2 o 3 pasos y completa '+goal+' pasos.';el('path',{d:'M0 370Q220 310 440 385T900 355V530H0Z',fill:'#3487a0'});for(let i=0;i<goal;i++){const x=85+i*68;let rect=el('rect',{x,y:310,width:63,height:67,rx:10,fill:'#315569',stroke:'#f7dfaa','stroke-width':3,class:'target'});target(rect,()=>{if(won||!slots.length)return;slots.pop();message.textContent='Has retirado el último tronco.';render()},'Retirar último tronco');}const built=slots.reduce((a,b)=>a+b,0);meter(built,goal,'Puente: '+built+' / '+goal+' pasos');const crossing=Math.min(1,built/goal);const traveler=el('g',{transform:'translate('+(82+crossing*660)+' '+(287-22*Math.sin(Math.PI*crossing))+')','aria-hidden':'true'});el('ellipse',{cx:0,cy:0,rx:20,ry:8,fill:'#102d38',opacity:.5},traveler);el('path',{d:'M-12 -7L-12 -33Q0 -49 12 -33L12 -7Z',fill:'#d49a6b',stroke:'#ffdfac','stroke-width':3},traveler);el('circle',{cx:0,cy:-47,r:19,fill:'#e9b68b',stroke:'#ffe2b4','stroke-width':3},traveler);el('circle',{cx:-6,cy:-50,r:2.8,fill:'#26344b'},traveler);el('circle',{cx:7,cy:-50,r:2.8,fill:'#26344b'},traveler);el('circle',{cx:17,cy:-20,r:9,fill:'#ffe6a0'},traveler);if(built===goal)txt(450,210,'¡Niko ha cruzado!',28);let offset=0;for(const [index,length] of slots.entries()){const px=85+offset*68;const plank=el('rect',{x:px,y:315,width:length*68-5,height:57,rx:9,fill:'#b98656',stroke:'#f8d8a3','stroke-width':3});el('path',{d:`M${px+12} 330h${length*68-29} M${px+12} 356h${length*68-29}`,stroke:'#815435','stroke-width':3,opacity:.6});target(plank,()=>{if(won)return;slots.splice(index,1);message.textContent='Tronco retirado. Puedes probar otra combinación.';render()},'Retirar tronco de '+length+' pasos');offset+=length}let x=135;for(let n=1;n<=3;n++){let r=el('rect',{x:x+(n-1)*130,y:435,width:112,height:53,rx:22,fill:'#b98656',stroke:'#f8d8a3','stroke-width':4,class:'piece'});txt(x+56+(n-1)*130,469,n+' pasos',19);const add=()=>{if(won)return;const total=slots.reduce((a,b)=>a+b,0);if(total+n>goal){message.textContent='Ese tronco sobresale. Prueba uno más corto.';return}slots.push(n);message.textContent=total+n===goal?'¡El puente llega a la otra orilla! Pulsa Comprobar.':'Puente: '+(total+n)+' de '+goal+' pasos. Faltan '+(goal-total-n)+'.';render()};target(r,()=>{if(suppressClick){suppressClick=false;return}add()},'Colocar tronco de '+n+' pasos');r.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY};r.setPointerCapture(e.pointerId)});r.addEventListener('pointerup',e=>{if(drag?.id!==e.pointerId)return;const box=world.getBoundingClientRect();const moved=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>12;drag=null;if(moved&&(e.clientY-box.top)/box.height<.77){suppressClick=true;add();setTimeout(()=>suppressClick=false,0)}});r.addEventListener('pointercancel',()=>drag=null)}txt(450,83,'El puente del arroyo',34)}
else if(stage===1){instruction.textContent='Enciende las luciérnagas de las flores doradas. ¡Hoy hay '+pattern.length+' flores doradas! Las azules deben quedar apagadas.';for(let i=0;i<10;i++){const x=115+i%5*168,y=190+Math.floor(i/5)*160;el('path',{d:`M${x} 480Q${x-20} ${y+40} ${x} ${y+15}`,stroke:'#8bba79','stroke-width':6,fill:'none'});for(let j=0;j<5;j++){const a=j*Math.PI*2/5;el('circle',{cx:x+Math.cos(a)*21,cy:y+25+Math.sin(a)*21,r:15,fill:pattern.includes(i)?'#f4c46c':'#8bb6dc'})}if(lights.has(i))el('circle',{cx:x,cy:y-20,r:65,fill:'url(#shine)'});let bug=el('circle',{cx:x,cy:y-20,r:25,fill:lights.has(i)?'#ffe080':'#4d6876',stroke:'#fff0bb','stroke-width':3});target(bug,()=>{if(won)return;lights.has(i)?lights.delete(i):lights.add(i);const correct=pattern.filter(j=>lights.has(j)).length,wrong=[...lights].filter(j=>!pattern.includes(j)).length;message.textContent=correct===pattern.length&&wrong===0?'¡Todas las flores doradas tienen luz! Pulsa Comprobar.':correct+' de '+pattern.length+' flores doradas iluminadas'+(wrong?' · '+wrong+' azul'+(wrong>1?'es':'')+' encendida'+(wrong>1?'s':''):'')+'.';render()},'Luciérnaga '+(i+1))}meter(pattern.filter(i=>lights.has(i)).length,pattern.length,'Flores doradas: '+pattern.filter(i=>lights.has(i)).length+' / '+pattern.length);txt(450,85,'El jardín de luz',34)}
else{instruction.textContent='Reparte '+goal+' unidades de energía. ¡Los tres cristales deben brillar! Toca cada uno para cargarlo (1 a 6); después de 6 vuelve a 0.';for(let i=0;i<3;i++){let x=225+i*225;el('path',{d:`M450 130L${x-45} 400L${x+45} 400Z`,fill:['#a9d5ff','#fce49e','#f2a7d6'][i],opacity:.08+beam[i]*.07});let crystal=el('path',{d:`M${x} 290l65 75 -65 90 -65 -90Z`,fill:['#7dc2eb','#eec878','#d994cc'][i],stroke:'#fff1c2','stroke-width':4});target(crystal,()=>{if(won)return;beam[i]=(beam[i]+1)%7;const sum=beam.reduce((a,b)=>a+b,0);message.textContent=sum===goal&&beam.every(v=>v>0)?'¡Los tres haces brillan y suman '+goal+'! Pulsa Comprobar.':sum===goal?'¡La suma es correcta! Ahora enciende los tres cristales.':sum<goal?'Energía: '+sum+' de '+goal+'. Faltan '+(goal-sum)+'.':'Energía: '+sum+' de '+goal+'. Sobran '+(sum-goal)+'.';render()},'Cristal '+(i+1)+', energía '+beam[i]);txt(x,385,String(beam[i]),35)}meter(beam.reduce((a,b)=>a+b,0),goal,'Energía: '+beam.reduce((a,b)=>a+b,0)+' / '+goal);txt(450,85,'El faro dormido',34)}if(won){el('circle',{cx:450,cy:130,r:95,fill:'url(#shine)'});txt(450,140,'¡CRISTAL CONSEGUIDO!',32)}}function start(){won=false;message.textContent='Puedes probar sin miedo: no hay tiempo límite.';slots=[];lights=new Set();beam=[0,0,0];goal=stage===0?rnd(5,10):stage===1?5:rnd(8,15);if(stage===1){const patterns=[[0,2,4,6],[1,3,5,7],[0,1,4,8],[2,5,7,9],[0,2,4,6,8],[1,3,5,7,9],[0,1,4,5,8],[1,2,5,6,9],[0,3,4,7,8],[2,3,6,7,9],[0,1,3,5,7,9],[0,2,4,6,8,9],[1,2,3,5,6,8],[0,1,4,5,7,8]];if(!window.__gardenBag?.length){window.__gardenBag=patterns.map((_,i)=>i);for(let i=window.__gardenBag.length-1;i>0;i--){const j=rnd(0,i);[window.__gardenBag[i],window.__gardenBag[j]]=[window.__gardenBag[j],window.__gardenBag[i]]}}pattern=patterns[window.__gardenBag.pop()];goal=pattern.length;}render()}document.querySelector('#check').onclick=()=>{if(stage===3)return;const total=stage===0?slots.reduce((a,b)=>a+b,0):stage===1?lights.size:beam.reduce((a,b)=>a+b,0);if(stage===1&&(lights.size!==pattern.length||pattern.some(i=>!lights.has(i)))){message.textContent='Todavía hay alguna flor dorada sin luz o alguna azul encendida. Observa los colores.';return}if(stage===2&&beam.some(v=>v===0)){message.textContent='¡El faro necesita sus tres haces! Enciende cada cristal y reparte '+goal+' unidades.';return}if(total!==goal){message.textContent=total<goal?'Faltan '+(goal-total)+'. ¡Sigue probando!':'Sobran '+(total-goal)+'. Puedes corregirlo.';return}won=true;crystals++;message.textContent='¡Bien hecho! Has recuperado un cristal.';render()};document.querySelector('#reset').onclick=()=>{if(stage===3){stage=0;crystals=0;round++}start()};document.querySelector('#hint').onclick=()=>{message.textContent=stage===3?'Has conseguido los tres cristales. Pulsa Jugar otra vez para repetir.':stage===0?'Combina troncos de 3, 2 y 1 hasta sumar '+goal+'.':stage===1?'Fíjate en el color de los pétalos: dorado significa encender, azul significa apagar.':'Empieza dando 1 unidad a cada cristal. Después reparte las '+(goal-3)+' restantes; ninguno puede superar 6.'};next.onclick=()=>{if(!won&&stage!==3)return;if(stage===3){stage=0;crystals=0;round++;start()}else if(stage===2){stage=3;won=false;render()}else{stage++;start()}};start()})();</script></html>
