<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MateGenio · Los tres haces del faro</title>
<style>:root{font:18px system-ui;color:#fff4d4;background:#101b35}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#38536c,#101b35)}main{width:min(100%,950px);padding:12px}h1{margin:6px 0;font-size:clamp(24px,4vw,38px)}p{margin:7px 0 12px}svg{display:block;width:100%;max-height:62dvh;border-radius:24px;background:#142b45;touch-action:manipulation}g[role=button]{cursor:pointer;touch-action:manipulation}g[role=button]:focus-visible{outline:none;filter:drop-shadow(0 0 12px white)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:15px;background:#ffdc8d;color:#34270f;padding:12px 17px;min-height:48px;font:700 17px system-ui}button:disabled{opacity:.5}button:focus-visible{outline:3px solid white}#feedback{min-height:30px;font-weight:700}.beam{transition:opacity .3s}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style>
<main><h1>Los tres haces del faro</h1><p id="task">Reparte la energía tocando los cristales. Cada toque añade una unidad; al llegar a seis, vuelve a cero.</p><svg viewBox="0 0 800 500" id="scene" role="group" aria-label="Faro interactivo con tres cristales"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#18294e"/><stop offset="1" stop-color="#3d6874"/></linearGradient></defs><rect width="800" height="500" fill="url(#sky)"/><circle cx="675" cy="85" r="43" fill="#fff0bd"/><path d="M0 390Q200 330 420 393T800 370V500H0Z" fill="#173c47"/><path d="M0 445Q300 380 800 445V500H0Z" fill="#28535b"/><path d="M355 410L375 140H425L445 410Z" fill="#f4e8c9" stroke="#a9c3c8" stroke-width="7"/><path d="M368 205H432M363 285H437M358 365H442" stroke="#bc9983" stroke-width="10"/><rect x="367" y="105" width="66" height="63" rx="14" fill="#b1c7cf" stroke="#fff1c5" stroke-width="6"/><g id="beams"></g><g id="crystals"></g><text id="total" x="400" y="45" text-anchor="middle" font-size="28" font-weight="800" fill="#fff3bf"></text><text id="victory" x="400" y="90" text-anchor="middle" font-size="32" font-weight="900" fill="#ffe48e"></text></svg><div class="controls"><button id="check">Encender el faro</button><button id="undo" disabled>Deshacer</button><button id="hint">Una pista</button><button id="new">Nuevo desafío</button></div><p id="feedback" role="status" aria-live="polite"></p></main>
<script>(()=>{'use strict';const ns='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),colors=['#ffd678','#a4e6f0','#efb7f4'],positions=[[225,300],[400,235],[575,300]];let values=[0,0,0],history=[],target=10,won=false,round=0,hints=0,lastTarget=null;const make=(tag,attrs,parent)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n};function render(){const focus=document.activeElement?.getAttribute('data-crystal'),group=$('#crystals'),beams=$('#beams');group.replaceChildren();beams.replaceChildren();const sum=values.reduce((a,b)=>a+b,0);for(let i=0;i<3;i++){const [x,y]=positions[i],v=values[i],g=make('g',{role:'button',tabindex:'0','data-crystal':i,'aria-label':`Cristal ${i+1}, ${v} unidades. Toca para añadir energía`},group);make('path',{d:`M${x} ${y-44}l40 44 -40 44 -40 -44Z`,fill:colors[i],opacity:.5+v/12,stroke:'#fff6d6','stroke-width':4},g);make('circle',{cx:x,cy:y,r:49,fill:'transparent'},g);make('text',{x,y:y+8,'text-anchor':'middle','font-size':29,'font-weight':900,fill:'#142638'},g).textContent=v;const beam=make('path',{d:`M400 130L${x-36} ${y-48}L${x+36} ${y-48}Z`,fill:colors[i],opacity:won?.75:v/17,class:'beam'},beams);beam.setAttribute('pointer-events','none');const change=()=>{if(won)return;history.push([...values]);values[i]=(values[i]+1)%7;$('#feedback').textContent='Energía actualizada. Puedes corregir cualquier cristal.';render()};g.addEventListener('click',change);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();change()}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();group.querySelector(`[data-crystal="${(i+(e.key==='ArrowRight'?1:2))%3}"]`)?.focus()}})}$('#total').textContent=`Energía: ${sum} / ${target} · Ronda ${round}`;$('#victory').textContent=won?'¡EL FARO BRILLA!':'';$('#check').disabled=won;$('#undo').disabled=won||!history.length;if(focus!==null&&focus!==undefined)group.querySelector(`[data-crystal="${focus}"]`)?.focus({preventScroll:true})}function reset(){round++;let t;do{t=8+Math.floor(Math.random()*9)}while(t===lastTarget);lastTarget=t;target=t;values=[0,0,0];history=[];won=false;hints=0;$('#feedback').textContent='Cada cristal admite de cero a seis unidades. Hay muchas soluciones.';render()}$('#check').onclick=()=>{const sum=values.reduce((a,b)=>a+b,0);if(sum===target){won=true;$('#feedback').textContent='¡Conseguiste equilibrar la luz! Los tres haces iluminan el bosque.'}else $('#feedback').textContent=sum<target?`Faltan ${target-sum} unidades. Sigue repartiendo.`:`Sobran ${sum-target} unidades. Toca un cristal hasta que vuelva a cero.`;render()};$('#undo').onclick=()=>{if(!history.length||won)return;values=history.pop();$('#feedback').textContent='Movimiento deshecho.';render()};$('#hint').onclick=()=>{hints++;const sum=values.reduce((a,b)=>a+b,0);$('#feedback').textContent=hints===1?'Prueba a repartir la energía entre los tres cristales.':`La suma actual es ${sum}; necesitas ${target}. Diferencia: ${Math.abs(target-sum)}.`};$('#new').onclick=reset;reset()})();</script></html>
