<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MateGenio · Taller del puente</title><style>
:root{font-family:system-ui,sans-serif;color:#fff4db;background:#101d36}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#344b70,#101d36)}main{width:min(100%,960px);padding:12px}h1{font-size:clamp(24px,4vw,42px);margin:8px 0}p{margin:8px 0 15px;line-height:1.4}svg.completed{box-shadow:0 0 0 5px #ffda80,0 15px 50px #0008}svg{width:100%;height:auto;max-height:70dvh;display:block;border-radius:24px;touch-action:none;background:#1b3454;box-shadow:0 15px 50px #0008}.log{cursor:grab;touch-action:none}.log:focus{outline:none;filter:drop-shadow(0 0 8px #fff)}.log.dragging{opacity:.8}.slot{stroke:#a3e0d5;stroke-width:3;stroke-dasharray:9 8;fill:#102c42}.slot.filled{stroke:#ffe6a5;stroke-dasharray:none;fill:#805335}.action{font:700 18px system-ui;fill:#fff4db;pointer-events:none}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}.bar button{font:700 18px system-ui;border:0;border-radius:15px;padding:13px 19px;background:#ffcf73;color:#302518;min-height:48px}.bar button:focus-visible{outline:3px solid white}.bar button:disabled{opacity:.5}#message{min-height:28px;font-weight:700}#message[role=status]{color:#ffe39a}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><main><h1>El puente de Niko</h1><p>Arrastra los troncos hasta los huecos del río. Cada tronco vale una unidad. También puedes tocar un tronco y después un hueco.</p><svg id="world" viewBox="0 0 800 500" role="group" aria-label="Escenario interactivo del puente">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#15284d"/><stop offset="1" stop-color="#4c6883"/></linearGradient><linearGradient id="wood"><stop stop-color="#b57a48"/><stop offset=".5" stop-color="#f3c282"/><stop offset="1" stop-color="#8c4f31"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#sky)"/><circle cx="680" cy="90" r="47" fill="#ffeab0"/><path d="M0 320Q180 220 360 315T800 275V500H0Z" fill="#163c43"/><path d="M0 365Q260 300 450 365T800 340V500H0Z" fill="#285b64"/><path d="M0 350Q400 305 800 350V500H0Z" fill="#3e9ca8"/><path d="M0 405Q400 360 800 410" fill="none" stroke="#94d8d6" stroke-width="10" opacity=".6"/><g id="slots"></g><g id="victory" aria-hidden="true" visibility="hidden"><path d="M80 285Q400 235 720 285" fill="none" stroke="#ffe7a0" stroke-width="12" stroke-linecap="round"/><text x="400" y="220" font-size="35" font-weight="800" fill="#fff0bd" text-anchor="middle">¡PUENTE COMPLETO!</text></g><g id="pieces"></g><g transform="translate(75 260)"><path d="M-38 -14L-48 -73 -10 -47 20 -47 52 -73 43 -13Q58 30 3 49Q-50 31 -38 -14Z" fill="#e99455" stroke="#8d4c3e" stroke-width="5"/><path d="M-29 8Q0 32 34 8Q28 45 3 49Q-20 40 -29 8" fill="#ffebcc"/><circle cx="-13" cy="-4" r="5" fill="#263447"/><circle cx="23" cy="-4" r="5" fill="#263447"/><path d="M-2 18L9 18L4 25Z" fill="#342c38"/></g><text x="400" y="45" text-anchor="middle" fill="#fff0b9" font-size="23" font-weight="700" id="objective"></text><text x="400" y="485" text-anchor="middle" fill="#f9e4b9" font-size="18" id="counter"></text></svg>
<div class="bar"><button id="undo">↶ Retirar último</button><button id="check">Probar puente</button><button id="again">↻ Nuevo reto</button></div><p id="message" role="status" aria-live="polite"></p></main><script>
(()=>{'use strict';const ns='http://www.w3.org/2000/svg',svg=document.querySelector('#world'),slots=document.querySelector('#slots'),pieces=document.querySelector('#pieces'),msg=document.querySelector('#message');let target,first,filled,chosen=null,drag=null,won=false;const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const node=(tag,attrs,parent)=>{const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el};function coordinates(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function position(i){return {x:90+i*620/(target-1),y:340}}function draw(){svg.classList.toggle('completed',won);document.querySelector('#victory').setAttribute('visibility',won?'visible':'hidden');slots.replaceChildren();pieces.replaceChildren();for(let i=0;i<target;i++){const {x,y}=position(i),r=node('rect',{x:x-29,y:y-23,width:58,height:46,rx:12,class:'slot'+(i<first||filled.includes(i)?' filled':'')},slots);r.setAttribute('role','button');r.setAttribute('tabindex','0');r.setAttribute('aria-label',i<first?'Tronco inicial':filled.includes(i)?'Retirar tronco '+(i+1):'Hueco '+(i+1)+' colocar tronco');const act=()=>{if(won||i<first)return;if(filled.includes(i)){filled=filled.filter(v=>v!==i);chosen=null}else if(chosen!==null){filled.push(i);chosen=null}else{filled.push(i)}draw()};r.addEventListener('click',act);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});if(i<first||filled.includes(i)){node('rect',{x:x-27,y:y-21,width:54,height:42,rx:12,fill:'url(#wood)',stroke:'#70442e','stroke-width':3,'pointer-events':'none'},slots)}}for(let j=0;j<target-first-filled.length;j++){const x=75+j*72,y=415,g=node('g',{class:'log',tabindex:0,role:'button','aria-label':'Tronco disponible '+(j+1),'data-piece':j},pieces);node('rect',{x:x-25,y:y-19,width:50,height:38,rx:10,fill:'url(#wood)',stroke:'#70442e','stroke-width':3},g);node('path',{d:'M'+(x-16)+' '+y+'h32',stroke:'#8b5b39','stroke-width':3},g);g.addEventListener('pointerdown',e=>{if(won)return;drag={id:e.pointerId,origin:{x,y},el:g,moved:false};g.setPointerCapture(e.pointerId);chosen=j;msg.textContent='Lleva el tronco a un hueco vacío.'});g.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=coordinates(e);drag.moved=true;g.setAttribute('transform','translate('+(p.x-drag.origin.x)+' '+(p.y-drag.origin.y)+')')});g.addEventListener('pointercancel',()=>{drag=null;chosen=null;draw()});g.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const p=coordinates(e),idx=Array.from({length:target},(_,i)=>i).find(i=>{const q=position(i);return i>=first&&!filled.includes(i)&&Math.abs(q.x-p.x)<35&&Math.abs(q.y-p.y)<42});drag=null;if(idx!==undefined){filled.push(idx);chosen=null;msg.textContent='¡Tronco colocado!'}else{chosen=null;msg.textContent='Toca un tronco y luego un hueco, o arrástralo hasta el puente.'}draw()});g.addEventListener('click',e=>{if(!won&&!e.detail){chosen=j;msg.textContent='Ahora toca un hueco del puente.'}});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chosen=j;msg.textContent='Seleccionado. Pulsa Enter en un hueco.'}})}document.querySelector('#counter').textContent=(first+filled.length)+' de '+target+' troncos';document.querySelector('#check').disabled=won}
function reset(){target=rand(5,9);first=rand(1,target-2);filled=[];chosen=null;drag=null;won=false;document.querySelector('#objective').textContent='Necesitamos '+target+' troncos. Hay '+first+'.';msg.textContent='¿Cuántos faltan? Construye el puente.';draw()}document.querySelector('#undo').onclick=()=>{if(filled.length&&!won){filled.pop();draw()}};document.querySelector('#check').onclick=()=>{if(first+filled.length!==target){msg.textContent='Todavía faltan '+(target-first-filled.length)+' troncos. ¡Sigue!';return}won=true;msg.textContent='¡Puente terminado! Niko puede cruzar. ¡Bien hecho!';draw()};document.querySelector('#again').onclick=reset;reset()})();
</script></html>
