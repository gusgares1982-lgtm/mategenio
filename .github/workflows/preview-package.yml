name: MateGenio iPad preview package

on:
  push:
    branches:
      - feat/**
      - automation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate educational logic
        run: npm test
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src tests -type f -name '*.js' -print0)
          node --check sw.js
      - name: Assemble static preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html practica.html manifest.webmanifest sw.js dist/
          cp -R src assets dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/assets/niko.svg
      - name: Upload verified preview
        uses: actions/upload-artifact@v4
        with:
          name: mategenio-preview-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
